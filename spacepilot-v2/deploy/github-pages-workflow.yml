name: Deploy SpacePilot to GitHub Pages

# Builds the static export in spacepilot-v2/ and publishes it to GitHub Pages.
# Enable once: repo Settings -> Pages -> Source = "GitHub Actions".
# Permanent URL will be: https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths:
      - 'spacepilot-v2/**'
      - '.github/workflows/spacepilot-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spacepilot-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacepilot-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spacepilot-v2/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Build static export
        # BASE_PATH makes assets resolve under /<repo>/ on project Pages.
        # If you deploy to a user/root domain, set BASE_PATH to "".
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: spacepilot-v2/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
