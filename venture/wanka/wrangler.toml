name = "wanka"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (the web SPA)
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "wanka-db"
database_id = "local-placeholder-id"
migrations_dir = "migrations"

# Vars (non-secret). Secrets (OPENAI_API_KEY, JWT_SECRET) go in .dev.vars / wrangler secret.
[vars]
APP_ENV = "development"
BRAND_NAME = "Wanka"
# Feature flags
ENABLE_REAL_AI = "false"   # when "true" and OPENAI_API_KEY present, calls the model; else deterministic mock
