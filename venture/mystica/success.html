<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Reading is Ready — Mystica</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,sans-serif;background:radial-gradient(ellipse at top,#241452,#0b0a1f 55%,#05040f);color:#efe9ff}
  .serif{font-family:'Cormorant Garamond',serif}.gold{color:#d4af6a}
  .glass{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,106,.25)}
  .spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body class="min-h-screen">
<nav class="max-w-3xl mx-auto flex justify-between items-center px-6 py-6">
  <a href="/" class="serif text-2xl gold">✦ Mystica</a>
</nav>
<div class="max-w-2xl mx-auto px-6 py-10">
  <div class="text-center mb-8">
    <div class="text-5xl mb-4">✦</div>
    <h1 class="serif text-4xl gold mb-2">Thank you. Your reading is ready.</h1>
    <p class="text-purple-200/70">The stars have been waiting for this moment.</p>
  </div>
  <div id="content" class="glass rounded-3xl p-8">
    <div class="text-center py-10"><div class="inline-block spin text-3xl gold">✦</div><p class="text-purple-200/70 mt-3">Unlocking your reading…</p></div>
  </div>
  <div class="text-center mt-8">
    <a href="/" class="text-sm border border-[#d4af6a] gold px-6 py-3 rounded-full">Back to Mystica</a>
  </div>
</div>
<footer class="border-t border-purple-400/10 py-8 text-center text-purple-300/40 text-xs mt-10">
  <p>For entertainment & self-reflection. © <span id="yr"></span> Mystica. · <a class="gold" href="/legal.html">Legal</a></p>
</footer>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
const params=new URLSearchParams(location.search);
const token=params.get('token');
const box=document.getElementById('content');
(async()=>{
  if(!token){box.innerHTML='<p class="text-center text-purple-300/60">No order found. If you were charged, email support@mystica.app.</p>';return;}
  try{
    const o=await (await fetch('/api/order/'+token)).json();
    if(!o.paid){box.innerHTML='<p class="text-center text-purple-300/60">Payment is still processing. Refresh in a moment, or check your email.</p>';return;}
    // 有 chart payload 则生成深度报告
    const meta=o.meta||{};
    if(o.product==='deep'&&meta.payload){
      const r=await (await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:meta.payload,lang:meta.lang||'en'})})).json();
      renderDeep(r.report);
    } else {
      box.innerHTML=`<div class="text-center">
        <h2 class="serif text-2xl gold mb-3">Order confirmed: ${o.product}</h2>
        <p class="text-purple-200/70">A confirmation and your reading (or shipping details) have been sent to your email.</p></div>`;
    }
  }catch(e){box.innerHTML='<p class="text-center text-purple-300/60">Something went wrong loading your reading. Email support@mystica.app and we will fix it instantly.</p>';}
})();
function renderDeep(rep){
  box.innerHTML=`<div class="text-center mb-6"><h2 class="serif text-4xl gold mb-2">${rep.title||''}</h2>
    <p class="text-purple-100/90 italic serif text-lg">${rep.opening||''}</p></div>
    ${(rep.sections||[]).map(s=>`<div class="mb-4 pb-4 border-b border-purple-400/10">
      <h3 class="serif text-2xl gold mb-1">${s.emoji||'✦'} ${s.heading||''}</h3>
      <p class="text-sm text-purple-100/80 leading-relaxed">${s.body||''}</p></div>`).join('')}
    <p class="text-center serif text-xl gold mt-4">${rep.closing||''}</p>`;
}
</script>
</body>
</html>
